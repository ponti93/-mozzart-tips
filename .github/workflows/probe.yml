name: Probe fetch routes

# Diagnostic only - tells us which way of reading the site works from GitHub's
# servers. Run it from the Actions tab and copy the log.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: bash scripts/probe.sh
