name: Mozzart tip watcher

# Runs once an hour. GitHub may delay scheduled runs by 5-15 minutes at busy
# times; that is fine for this job.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-send the current pending tip even if it was already announced'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tip-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Check for new tips
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: xvfb-run -a node src/index.js ${{ inputs.force && '--force' || '' }}

      - name: Commit state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "state: $(date -u +%FT%TZ)"
            git push
          else
            echo "no state change"
          fi
