name: Mozzart tip watcher

# Runs once an hour. GitHub may delay scheduled runs by 5-15 minutes at busy
# times; that is fine for this job.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-send the current pending tip even if it was already announced'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tip-watcher
  cancel-in-progress: false

jobs:
  check:
    # pinned: ubuntu-latest is moving to Ubuntu 26, which broke the browser step
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xauth >/dev/null || echo "xvfb install failed - will run headless"

      - name: Check for new tips
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          echo "chrome: $CHROME_PATH"
          if command -v xvfb-run >/dev/null; then
            xvfb-run -a --server-args="-screen 0 1280x900x24" node src/index.js ${{ inputs.force && '--force' || '' }}
          else
            node src/index.js ${{ inputs.force && '--force' || '' }}
          fi

      - name: Commit state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "state: $(date -u +%FT%TZ)"
            git push
          else
            echo "no state change"
          fi
